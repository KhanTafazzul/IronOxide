[package]
name = "mc_crafting"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Automated Minecraft recipe parser, shaped/shapeless deserializer, and O(1) crafting lookup engine"

[dependencies]
mc_items = { path = "../mc_items", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }


