[package]
name = "mc_worldgen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Deterministic 1:1 seed-for-seed terrain, biome, and cave noise generator for Minecraft 1.20.4"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
